<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-9</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="nav">

            <p class="logo">LOGO</p>

            <!-- Desktop Navigation -->
            <div class="desktop-links">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Contact Us</a></li>
                </ul>
            </div>

            <!-- Username Button -->
            <button class="username">Username</button>

            <!-- Mobile Hamburger Menu -->
            <div class="mobile-menu-btn">

                <button class="hamburger" aria-label="Open navigation menu">
                    <svg width="24" height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <path d="M4 6H20M4 12H20M4 18H20"
                            stroke="#1e293b"
                            stroke-width="2.5"
                            stroke-linecap="round" />

                    </svg>
                </button>

                <!-- Right Side Menu -->
                <div class="menu-list">
                    <a href="#">Home</a>
                    <a href="#">Services</a>
                    <a href="#">About Us</a>
                    <a href="#">Contact Us</a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">

        <!-- Left Section -->
        <div class="left">

            <h1>
                Revitalize Your
                <span>Clothes with Expert</span>
                <span class="blue">Laundry Services!</span>
            </h1>

            <p>
                From premium dry cleaning and wash and fold,
                we deliver care and convenience. Schedule a
                pickup and rediscover the freshness of your
                clothes today!
            </p>

            <button class="hero-button">
                Book a Service Today!
            </button>

        </div>

        <!-- Right Section -->
        <div class="right">
            <img src="image_5abe01cb-removebg-preview.png"
                alt="Laundry Services">
        </div>

    </div>

</body>

</html>
